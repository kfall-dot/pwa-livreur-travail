name: E2E (non-régression)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # Groupe GLOBAL : la branche DB e2e est partagée (reset entre chaque spec) —
  # deux runs simultanés (ex. PR + master) se corrompraient mutuellement.
  # Les runs se mettent en file plutôt que de tourner en parallèle.
  group: e2e
  cancel-in-progress: false

jobs:
  regression:
    name: build + lint + unit + e2e (99 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Navigateurs Playwright (chromium)
        run: npx playwright install chromium --with-deps

      # build:server + lint + 167 tests unit + migrations BTP + suite e2e
      # (serveur autonome Express :8888 — scripts      # (serveur autonome Express :8888 — scripts      # (serveur autonome Express :nv:
          E2E_DATABASE_URL:  {{      ts          E2E_DATABAS        run: bash           E2E_DATABsh

      - name: Rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
