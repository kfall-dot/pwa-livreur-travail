name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  # Un seul run à la fois par branche pour éviter les conflits DB
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Secrets Netlify (Settings → Secrets → Actions) : NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
  # Contournements tests — alignés sur config/validations-tests.env et playwright.config.ts
  GEOFENCE_BYPASS: 'true'
  OTP_CODE: '123456'
  ALLOW_RESET: 'true'
  ALLOW_SEED: 'true'
  ALLOW_WIPE_USERS: 'true'
  VITE_E2E: 'true'
  VITE_GEOFENCE_BYPASS: 'true'
  VITE_PHOTOS_BYPASS: 'true'

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── Node.js ─────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # ── Dépendances ─────────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Navigateurs Playwright ──────────────────────────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # ── Build serveur ───────────────────────────────────────────────────────
      - name: Build server (TypeScript)
        run: npm run build:server

      - name: Lint
        run: npm run lint

      - name: Verify Netlify secrets
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Secrets NETLIFY_AUTH_TOKEN et NETLIFY_SITE_ID requis (Settings → Secrets → Actions)."
            exit 1
          fi

      # ── Migrations DB (branche E2E uniquement — jamais la prod pilote) ─────
      - name: Apply DB migrations
        run: |
          npm run db:migrate || node scripts/apply-btp-migration.mjs
        env:
          NETLIFY_DB_URL: ${{ secrets.E2E_DATABASE_URL }}

      # ── Tests E2E (non-régression) ───────────────────────────────────────────
      # Aligné sur scripts/regression.sh — netlify dev via playwright.config.ts
      - name: Run regression tests
        run: npm run test:e2e
        env:
          CI: true
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}

      # ── Rapport de tests ─────────────────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
