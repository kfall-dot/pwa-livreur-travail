<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
      <link rel="icon" type="image/png" href="/favicon.png?v=6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b4a2c" />
    <meta name="description" content="TraceO® — La plateforme de traçabilité des opérations terrain" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TraceO" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link
      rel="apple-touch-startup-image"
      href="/brand/apple-splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/brand/apple-splash-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=Fraunces:opsz,wght@9..144,700&display=swap"
      rel="stylesheet"
    />
    <title>TraceO®</title>
    <style>
      /* Splash bootstrap — visible jusqu’au premier paint React */
      #traceo-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #0b4a2c;
        color: #fff;
        font-family: 'DM Sans', system-ui, sans-serif;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #traceo-boot.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #traceo-boot img {
        width: min(112px, 28vw);
        height: auto;
      }
      #traceo-boot strong {
        font-size: clamp(1.6rem, 5vw, 2rem);
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      #traceo-boot strong span { color: #e85d04; font-size: 0.55em; vertical-align: super; }
      #traceo-boot p {
        margin: 0;
        max-width: 16rem;
        text-align: center;
        font-size: 0.85rem;
        font-weight: 500;
        color: #bcd2c6;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="traceo-boot" aria-hidden="true">
      <img src="/brand/traceo-mark-onbrand.svg" alt="" width="112" height="112" />
      <strong>TraceO<span>®</span></strong>
      <p>La plateforme de traçabilité des opérations terrain</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
